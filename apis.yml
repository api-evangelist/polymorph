aid: polymorph
name: Polymorph
description: >-
  Polymorph is a Y Combinator (Winter 2026) startup building adaptive consumer
  internet infrastructure that personalizes user experiences with AI agents.
  Founded in San Francisco by Andrew Sy, the platform runs thousands of
  continuous product and lifecycle-engagement experiments for its customers,
  each carrying the craft of that product's direction and brand, so consumer
  teams can scale experimentation in product surfaces without being bottlenecked
  by headcount or design capacity. Its stated vision is to make the consumer
  internet polymorphic — one that adapts to each user and optimizes for
  delightful experiences. As of this profile the company operates a marketing
  site only; it publishes no public API, developer documentation, SDKs, or
  developer portal.
